<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethos Discipline Tracker</title>
  <style>
    :root {
      --bg-color: #0f0a05;
      --card-bg: #1c130a;
      --card-bg-elevated: #281b0e;
      --text-color: #fff8f2;
      --text-muted: #d4a373;
      --accent-color: #ff7700;
      --accent-glow: rgba(255, 119, 0, 0.4);
      --border-color: #4a2800;
      --border-bright: #9e5300;
      --dot-empty: #261505;
      --main-gradient: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
      
      --gold-color: #ffd700;
      --gold-glow: rgba(255, 215, 0, 0.5);
    }

    /* TEMAS DE COLOR */
    body.theme-naranja { --bg-color: #0f0a05; --card-bg: #1c130a; --card-bg-elevated: #281b0e; --text-color: #fff8f2; --text-muted: #d4a373; --accent-color: #ff7700; --accent-glow: rgba(255, 119, 0, 0.4); --border-color: #4a2800; --border-bright: #9e5300; --dot-empty: #261505; --main-gradient: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); }
    body.theme-dorado { --bg-color: #0d0b03; --card-bg: #181405; --card-bg-elevated: #221c08; --text-color: #fff9e6; --text-muted: #cbb886; --accent-color: #ffd700; --accent-glow: rgba(255, 215, 0, 0.35); --border-color: #44370f; --border-bright: #8a7122; --dot-empty: #26200a; --main-gradient: linear-gradient(135deg, #ffe875 0%, #f7b731 50%, #c88d00 100%); }
    body.theme-azul { --bg-color: #030a16; --card-bg: #08142c; --card-bg-elevated: #0f1e3d; --text-color: #e6f2ff; --text-muted: #7fa2c7; --accent-color: #0088ff; --accent-glow: rgba(0, 136, 255, 0.4); --border-color: #0f3460; --border-bright: #1f5f9e; --dot-empty: #0a192f; --main-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
    body.theme-esmeralda { --bg-color: #02120b; --card-bg: #062417; --card-bg-elevated: #0d3824; --text-color: #e6ffea; --text-muted: #73b88c; --accent-color: #00e676; --accent-glow: rgba(0, 230, 118, 0.4); --border-color: #0a472a; --border-bright: #127546; --dot-empty: #082115; --main-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
    body.theme-purpura { --bg-color: #0d0514; --card-bg: #1a0b29; --card-bg-elevated: #27123d; --text-color: #f7e6ff; --text-muted: #b47fcf; --accent-color: #b000ff; --accent-glow: rgba(176, 0, 255, 0.4); --border-color: #430c5c; --border-bright: #731b9e; --dot-empty: #190826; --main-gradient: linear-gradient(135deg, #ea00d9 0%, #711c91 100%); }
    body.theme-rojo { --bg-color: #140303; --card-bg: #290808; --card-bg-elevated: #3d0f0f; --text-color: #ffe6e6; --text-muted: #cf7f7f; --accent-color: #ff2a2a; --accent-glow: rgba(255, 42, 42, 0.4); --border-color: #5c0c0c; --border-bright: #9e1b1b; --dot-empty: #260808; --main-gradient: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }
    body.theme-rosa { --bg-color: #14030d; --card-bg: #29081a; --card-bg-elevated: #3d0f27; --text-color: #ffe6f4; --text-muted: #cf7fa8; --accent-color: #ff007f; --accent-glow: rgba(255, 0, 127, 0.4); --border-color: #5c0c39; --border-bright: #9e1b64; --dot-empty: #260818; --main-gradient: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%); }
    body.theme-plata { --bg-color: #0d0f12; --card-bg: #1a1e24; --card-bg-elevated: #282e38; --text-color: #f0f4f8; --text-muted: #9aa5b1; --accent-color: #00d2ff; --accent-glow: rgba(0, 210, 255, 0.3); --border-color: #333e48; --border-bright: #52606d; --dot-empty: #181c20; --main-gradient: linear-gradient(135deg, #e6dada 0%, #274046 100%); }
    body.theme-mono { --bg-color: #0a0a0a; --card-bg: #141414; --card-bg-elevated: #242424; --text-color: #ffffff; --text-muted: #888888; --accent-color: #ffffff; --accent-glow: rgba(255, 255, 255, 0.3); --border-color: #333333; --border-bright: #666666; --dot-empty: #1c1c1c; --main-gradient: linear-gradient(135deg, #ffffff 0%, #888888 100%); }
    body.theme-atardecer { --bg-color: #12030f; --card-bg: #21081b; --card-bg-elevated: #330f2b; --text-color: #fff0f5; --text-muted: #d98cb3; --accent-color: #ff4500; --accent-glow: rgba(255, 69, 0, 0.4); --border-color: #570e3c; --border-bright: #8a1760; --dot-empty: #210619; --main-gradient: linear-gradient(135deg, #ff4500 0%, #ff007f 50%, #7f00ff 100%); }

    /* ANIMACIONES DEL FUEGO REALISTA Y FLUIDO */
    @keyframes flameOuter {
      0% { transform: scale(1) rotate(-1deg); }
      50% { transform: scale(1.08, 1.12) rotate(2deg); }
      100% { transform: scale(0.96, 0.98) rotate(-2deg); }
    }
    @keyframes flameMid {
      0% { transform: scale(1) rotate(2deg); }
      50% { transform: scale(1.1, 1.05) rotate(-1deg); }
      100% { transform: scale(0.95, 1.02) rotate(1deg); }
    }
    @keyframes flameInner {
      0% { transform: scale(1); }
      50% { transform: scale(1.15, 1.2); }
      100% { transform: scale(0.9); }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .hidden { display: none !important; }

    /* AUTH MODAL */
    .auth-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }

    .auth-modal {
      position: relative; background: var(--card-bg); padding: 35px 25px;
      border-radius: 16px; border: 2px solid var(--border-bright); text-align: center;
      width: 350px; box-shadow: 0 0 35px var(--accent-glow);
    }

    .ethos-badge {
      position: absolute; top: -14px; left: 20px; background: #000;
      border: 1px solid var(--accent-color); border-radius: 20px;
      padding: 4px 12px; display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: bold; color: var(--accent-color);
    }

    .ethos-icon {
      width: 16px; height: 16px; background: var(--main-gradient);
      color: #000; border-radius: 4px; display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 900;
    }

    .auth-subtitle {
      font-size: 12px; margin-top: 10px; font-style: italic; color: var(--text-muted);
      min-height: 40px; display: flex; align-items: center; justify-content: center;
    }

    .auth-panel { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .auth-panel input {
      padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); outline: none;
    }

    .auth-primary {
      padding: 12px; background: var(--main-gradient); border: none;
      font-weight: 800; cursor: pointer; border-radius: 8px; color: #000;
    }

    /* LAYOUT PRINCIPAL */
    .main-container { width: 100%; max-width: 800px; padding: 25px 20px; flex: 1; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .brand-title { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
      width: 38px; height: 38px; background: var(--main-gradient);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 900; font-size: 20px; box-shadow: 0 0 18px var(--accent-glow);
    }

    h1 {
      font-size: 22px; letter-spacing: 1px;
      background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .settings-btn {
      background: var(--main-gradient); border: none; padding: 10px 18px;
      border-radius: 8px; cursor: pointer; font-weight: 700; color: #000;
    }

    .motivation-bar {
      background: var(--card-bg); border: 1px solid var(--border-bright);
      padding: 16px 20px; border-radius: 14px; margin-bottom: 25px;
      display: flex; justify-content: space-between; align-items: center; font-size: 14px;
    }

    .quote-text { font-style: italic; color: var(--text-muted); max-width: 65%; line-height: 1.3; }

    /* FUEGO REALISTA SVG MULTICAPA */
    .streak-tag {
      padding: 6px 14px; border-radius: 20px; font-weight: 800;
      display: flex; align-items: center; gap: 8px; transition: all 0.3s;
    }

    .flame-container { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 26px; }
    .flame-svg { width: 100%; height: 100%; overflow: visible; }
    
    .flame-layer-outer { transform-origin: bottom center; animation: flameOuter 0.6s infinite alternate ease-in-out; }
    .flame-layer-mid { transform-origin: bottom center; animation: flameMid 0.45s infinite alternate ease-in-out; }
    .flame-layer-inner { transform-origin: bottom center; animation: flameInner 0.3s infinite alternate ease-in-out; }

    /* COLORES DE RACHA */
    .streak-grey { background: rgba(150, 150, 150, 0.1); border: 1px solid #777; color: #aaa; }
    .streak-grey .flame-layer-outer { fill: #555; }
    .streak-grey .flame-layer-mid { fill: #777; }
    .streak-grey .flame-layer-inner { fill: #aaa; }

    .streak-orange { background: rgba(255, 119, 0, 0.15); border: 1px solid #ff7700; color: #ff7700; }
    .streak-orange .flame-layer-outer { fill: #ff3300; }
    .streak-orange .flame-layer-mid { fill: #ff7700; }
    .streak-orange .flame-layer-inner { fill: #ffcc00; }

    .streak-red { background: rgba(255, 42, 42, 0.15); border: 1px solid #ff2a2a; color: #ff2a2a; }
    .streak-red .flame-layer-outer { fill: #990000; }
    .streak-red .flame-layer-mid { fill: #ff2a2a; }
    .streak-red .flame-layer-inner { fill: #ff9999; }

    .streak-blue { background: rgba(0, 136, 255, 0.15); border: 1px solid #0088ff; color: #0088ff; }
    .streak-blue .flame-layer-outer { fill: #003399; }
    .streak-blue .flame-layer-mid { fill: #0088ff; }
    .streak-blue .flame-layer-inner { fill: #99ccff; }

    .streak-green { background: rgba(0, 230, 118, 0.15); border: 1px solid #00e676; color: #00e676; }
    .streak-green .flame-layer-outer { fill: #006633; }
    .streak-green .flame-layer-mid { fill: #00e676; }
    .streak-green .flame-layer-inner { fill: #b3ffcc; }

    .streak-purple-gold { background: rgba(176, 0, 255, 0.15); border: 1px solid #b000ff; color: #ffd700; }
    .streak-purple-gold .flame-layer-outer { fill: #550088; }
    .streak-purple-gold .flame-layer-mid { fill: #b000ff; }
    .streak-purple-gold .flame-layer-inner { fill: #ffd700; }

    .streak-gold { background: rgba(255, 215, 0, 0.2); border: 1px solid #ffd700; color: #ffd700; }
    .streak-gold .flame-layer-outer { fill: #cc8800; }
    .streak-gold .flame-layer-mid { fill: #ffd700; }
    .streak-gold .flame-layer-inner { fill: #ffffff; }

    /* HÁBITOS REFORMATEADOS */
    .habits-section {
      background: var(--card-bg); padding: 22px; border-radius: 16px;
      border: 1px solid var(--border-color); margin-bottom: 25px;
    }

    .add-habit-box { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .add-habit-box input, .add-habit-box select {
      padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); outline: none;
    }
    .add-habit-box input { flex: 2; min-width: 180px; }
    .add-habit-box button {
      padding: 12px 20px; background: var(--main-gradient); border: none;
      border-radius: 8px; cursor: pointer; font-weight: 800; color: #000;
    }

    .filters-bar { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn {
      padding: 6px 16px; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-muted); border-radius: 20px; cursor: pointer; font-size: 13px;
    }
    .filter-btn.active { background: var(--accent-color); color: #000; font-weight: 700; border-color: var(--accent-color); }

    .habit-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    
    /* TARJETA DE HÁBITO CON FONDO VERDE AL COMPLETAR Y CATEGORÍA ABAJO */
    .habit-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; background: var(--card-bg-elevated); border-radius: 10px;
      border: 1px solid var(--border-color); transition: all 0.3s ease;
    }
    .habit-item.completed {
      background: rgba(76, 209, 55, 0.15) !important;
      border-color: #4cd137 !important;
      box-shadow: 0 0 10px rgba(76, 209, 55, 0.2);
    }
    .habit-item.completed .habit-title { text-decoration: line-through; opacity: 0.8; }

    .habit-details { display: flex; flex-direction: column; gap: 3px; }
    .habit-title { font-size: 15px; font-weight: 600; color: var(--text-color); }
    .habit-category-subtitle { font-size: 12px; font-weight: 700; color: var(--accent-color); }

    .btn-action {
      background: transparent; border: 1px solid var(--border-color);
      color: var(--text-color); padding: 6px 12px; border-radius: 6px;
      cursor: pointer; font-size: 14px; margin-left: 6px;
    }
    .btn-action.check { color: #4cd137; border-color: #4cd137; }
    .btn-action.delete { color: #e74c3c; border-color: #e74c3c; }

    /* GRÁFICAS */
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 650px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--card-bg); padding: 22px; border-radius: 16px;
      border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center;
    }
    .chart-card.full-width { grid-column: 1 / -1; width: 100%; }
    .chart-card h3 { margin-bottom: 18px; font-size: 13px; text-transform: uppercase; color: var(--accent-color); }

    .pie-chart-wrapper { position: relative; width: 130px; height: 130px; }
    .pie-chart-wrapper svg { transform: rotate(-90deg); border-radius: 50%; }
    .pie-center-text {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: var(--accent-color);
    }

    /* GRÁFICA DE PUNTOS MENSUAL SVG */
    .line-chart-container { width: 100%; height: 130px; display: flex; align-items: center; justify-content: center; }
    .line-chart-svg { width: 100%; height: 100%; overflow: visible; }

    .year-grid-container { width: 100%; overflow-x: auto; padding-bottom: 10px; }
    .year-grid { display: grid; grid-template-rows: repeat(7, 13px); grid-auto-flow: column; grid-auto-columns: 13px; gap: 4px; }
    .year-dot { width: 13px; height: 13px; border-radius: 3px; background: var(--dot-empty); }
    .year-dot.lvl-1 { background: rgba(255, 255, 255, 0.2); }
    .year-dot.lvl-2 { background: var(--border-bright); }
    .year-dot.lvl-3 { background: var(--accent-color); }
    .year-dot.lvl-gold { background: var(--gold-color) !important; }

    /* PANEL AJUSTES */
    .profile-panel {
      position: fixed; top: 70px; right: 20px; background: var(--card-bg);
      border: 1px solid var(--border-bright); padding: 20px; border-radius: 12px;
      display: flex; flex-direction: column; gap: 12px; z-index: 100; width: 310px;
    }

    .theme-selector { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .theme-dot { width: 100%; height: 26px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .theme-dot.locked { cursor: not-allowed; opacity: 0.5; }

    .json-actions { display: flex; gap: 8px; }
    .theme-btn { padding: 10px; background: var(--main-gradient); border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #000; width: 100%; }
    .theme-btn.secondary { background: var(--border-color); color: var(--text-color); }
    .theme-btn.accent { background: #0088ff; color: #fff; }

    .creators-footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-color); width: 100%; }
  </style>
</head>
<body class="theme-naranja">

  <!-- AUTH MODAL -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-modal">
      <div class="ethos-badge">
        <div class="ethos-icon">E</div>
        <span>Ethos Discipline</span>
      </div>
      <h2 style="margin-top:10px; font-size: 20px;">INICIAR SESIÓN</h2>
      <p id="loginQuote" class="auth-subtitle">Cargando...</p>
      <div id="loginPanel" class="auth-panel">
        <input type="email" id="loginEmail" placeholder="Correo Electrónico">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button id="loginBtn" class="auth-primary">Acceder</button>
      </div>
    </div>
  </div>

  <div class="main-container">
    <header class="header">
      <div class="brand-title">
        <div class="brand-icon">E</div>
        <h1>ETHOS TRACKER</h1>
      </div>
      <button id="openProfile" class="settings-btn">Ajustes</button>
    </header>

    <div class="motivation-bar">
      <span id="quoteText" class="quote-text">Cargando...</span>
      <div id="streakContainer" class="streak-tag streak-grey">
        <div class="flame-container">
          <svg class="flame-svg" viewBox="0 0 50 65">
            <!-- Capa Exterior del Fuego -->
            <path class="flame-layer-outer" d="M25,5 C32,18 45,28 45,43 C45,55 36,63 25,63 C14,63 5,55 5,43 C5,28 18,18 25,5 Z"/>
            <!-- Capa Intermedia -->
            <path class="flame-layer-mid" d="M25,18 C30,27 38,34 38,45 C38,53 32,58 25,58 C18,58 12,53 12,45 C12,34 20,27 25,18 Z"/>
            <!-- Núcleo Brillante -->
            <path class="flame-layer-inner" d="M25,32 C28,37 31,41 31,48 C31,52 28,55 25,55 C22,55 19,52 19,48 C19,41 22,37 25,32 Z"/>
          </svg>
        </div>
        <span>Racha:</span> <span id="streakCount">0</span>
      </div>
    </div>

    <!-- HÁBITOS -->
    <section class="habits-section">
      <div class="add-habit-box">
        <input type="text" id="habitInput" placeholder="Añadir nuevo hábito...">
        <select id="categorySelect">
          <option value="Salud">🏥 Salud</option>
          <option value="Estudio">📚 Estudio</option>
          <option value="Personal">👤 Personal</option>
          <option value="__NEW__">+ Nueva categoría...</option>
        </select>
        <button id="addHabitBtn">Añadir</button>
      </div>

      <div id="filtersBar" class="filters-bar"></div>
      <ul id="habitList" class="habit-list"></ul>
    </section>

    <!-- GRÁFICAS -->
    <section class="charts-grid">
      <div class="chart-card">
        <h3>Progreso Hoy</h3>
        <div class="pie-chart-wrapper">
          <svg width="130" height="130" viewBox="0 0 42 42">
            <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="var(--dot-empty)" stroke-width="5"></circle>
            <circle id="pieSegment" cx="21" cy="21" r="15.915" fill="transparent" stroke="var(--accent-color)" stroke-width="5" stroke-dasharray="0 100" style="transition: stroke-dasharray 0.5s ease;"></circle>
          </svg>
          <div id="piePercent" class="pie-center-text">0%</div>
        </div>
      </div>

      <div class="chart-card">
        <h3>Rendimiento Mensual (30 Días)</h3>
        <div class="line-chart-container">
          <svg id="monthlyLineChart" class="line-chart-svg" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
        </div>
      </div>

      <div class="chart-card full-width">
        <h3>Mapa de Constancia Anual (365 Días)</h3>
        <div class="year-grid-container">
          <div id="yearGrid" class="year-grid"></div>
        </div>
      </div>
    </section>

    <!-- PANEL AJUSTES PERFIL -->
    <aside id="profilePanel" class="profile-panel hidden">
      <h3>Ajustes</h3>
      <p style="font-size: 13px;"><strong>Usuario:</strong> <span id="profileName">-</span></p>

      <label style="font-size: 12px; font-weight: bold;">Seleccionar Tema:</label>
      <div class="theme-selector">
        <div class="theme-dot" style="background: #ff7700;" onclick="setTheme('theme-naranja')" title="Naranja"></div>
        <div id="goldThemeDot" class="theme-dot locked" style="background: #ffd700;" onclick="setTheme('theme-dorado')" title="Dorado (Requiere 365 Días)">🔒</div>
        <div class="theme-dot" style="background: #0088ff;" onclick="setTheme('theme-azul')" title="Azul"></div>
        <div class="theme-dot" style="background: #00e676;" onclick="setTheme('theme-esmeralda')" title="Esmeralda"></div>
        <div class="theme-dot" style="background: #b000ff;" onclick="setTheme('theme-purpura')" title="Púrpura"></div>
        <div class="theme-dot" style="background: #ff2a2a;" onclick="setTheme('theme-rojo')" title="Rojo"></div>
        <div class="theme-dot" style="background: #ff007f;" onclick="setTheme('theme-rosa')" title="Rosa"></div>
        <div class="theme-dot" style="background: #00d2ff;" onclick="setTheme('theme-plata')" title="Plata"></div>
        <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('theme-mono')" title="Mono"></div>
        <div class="theme-dot" style="background: linear-gradient(45deg, #ff4500, #ff007f);" onclick="setTheme('theme-atardecer')" title="Atardecer"></div>
      </div>

      <hr style="border-color: var(--border-color); margin: 4px 0;">

      <label style="font-size: 12px; font-weight: bold;">Copia de Seguridad Data JSON:</label>
      <div class="json-actions">
        <button id="exportJsonBtn" class="theme-btn accent" style="font-size: 12px;">Exportar</button>
        <button id="importJsonBtn" class="theme-btn secondary" style="font-size: 12px;">Importar</button>
        <input type="file" id="importJsonInput" accept=".json" class="hidden">
      </div>

      <button id="clearLocal" class="theme-btn" style="margin-top: 6px;">Cerrar Sesión</button>
      <button id="closeProfile" class="theme-btn secondary">Cerrar Panel</button>
    </aside>
  </div>

  <footer class="creators-footer">
    Ethos Habit Tracker • Creadores de páginas webs
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDwLTK1bT2nB215W03Ot2N6UxEsLbN36Jk",
      authDomain: "ethos-brawl-tracker.firebaseapp.com",
      projectId: "ethos-brawl-tracker",
      storageBucket: "ethos-brawl-tracker.firebasestorage.app",
      messagingSenderId: "706650010986",
      appId: "1:706650010986:web:a36704353f52b094a4e113"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MOTIVATIONAL_QUOTES = [
      "La disciplina es la clave de la libertad personal.",
      "El éxito no se logra por suerte, sino con consistencia diaria.",
      "Haz hoy lo que otros no quieren para vivir mañana como otros no pueden.",
      "Pequeños hábitos diarios generan grandes resultados anuales.",
      "Tu único límite es la mente que te dice que no puedes."
    ];

    let user = null;
    let habits = JSON.parse(localStorage.getItem("trackerHabits_v2")) || [];
    let history = JSON.parse(localStorage.getItem("trackerHistory_v2")) || {};
    let customCategories = JSON.parse(localStorage.getItem("trackerCategories_v2")) || ["Salud", "Estudio", "Personal"];
    let activeFilter = "Todos";
    let currentStreak = 0;

    function getRandomQuote() { return MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)]; }

    document.getElementById("loginQuote").textContent = `"${getRandomQuote()}"`;
    document.getElementById("quoteText").textContent = `"${getRandomQuote()}"`;

    const savedTheme = localStorage.getItem("trackerTheme_v2") || "theme-naranja";
    document.body.className = savedTheme;

    window.setTheme = (themeClass) => {
      if (themeClass === 'theme-dorado' && currentStreak < 365) {
        alert("🔒 El tema Dorado requiere alcanzar una racha ininterrumpida de 365 días.");
        return;
      }
      document.body.className = themeClass;
      localStorage.setItem("trackerTheme_v2", themeClass);
    };

    function checkDailyReset() {
      const today = new Date().toISOString().split('T')[0];
      const lastOpened = localStorage.getItem("trackerLastDate_v2");

      if (lastOpened !== today) {
        habits = habits.map(h => ({ ...h, completed: false }));
        localStorage.setItem("trackerLastDate_v2", today);
        localStorage.setItem("trackerHabits_v2", JSON.stringify(habits));
      }
    }

    function checkAuth() {
      if (!user) {
        document.getElementById("authOverlay").classList.remove("hidden");
      } else {
        document.getElementById("authOverlay").classList.add("hidden");
        document.getElementById("profileName").textContent = user.email;
        checkDailyReset();
        renderCategoryOptions();
        saveAndRender();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value.trim();
      if (!email || !pass) return alert("Por favor introduce correo y contraseña");

      const docId = email.replace(/[^a-zA-Z0-9]/g, "_");
      const ref = doc(db, "users", docId);
      const snap = await getDoc(ref);

      if (snap.exists()) {
        if (snap.data().password !== pass) return alert("Contraseña incorrecta");
      } else {
        await setDoc(ref, { email: email, password: pass });
      }

      user = { email };
      checkAuth();
    });

    const categorySelect = document.getElementById("categorySelect");
    categorySelect.addEventListener("change", (e) => {
      if (e.target.value === "__NEW__") {
        const newCat = prompt("Nueva categoría:");
        if (newCat && newCat.trim() !== "") {
          const formatted = newCat.trim();
          if (!customCategories.includes(formatted)) {
            customCategories.push(formatted);
            localStorage.setItem("trackerCategories_v2", JSON.stringify(customCategories));
          }
          renderCategoryOptions();
          categorySelect.value = formatted;
        } else {
          categorySelect.value = customCategories[0] || "Personal";
        }
      }
    });

    function renderCategoryOptions() {
      categorySelect.innerHTML = customCategories.map(c => `<option value="${c}">${c}</option>`).join('') +
        `<option value="__NEW__">+ Nueva categoría...</option>`;

      const filtersBar = document.getElementById("filtersBar");
      filtersBar.innerHTML = `<button class="filter-btn ${activeFilter === 'Todos' ? 'active' : ''}" onclick="setFilter('Todos')">Todos</button>` +
        customCategories.map(c => `<button class="filter-btn ${activeFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`).join('');
    }

    document.getElementById("addHabitBtn").addEventListener("click", () => {
      const text = document.getElementById("habitInput").value.trim();
      const cat = categorySelect.value;
      if (!text || cat === "__NEW__") return;

      habits.push({ id: Date.now(), name: text, category: cat, completed: false });
      document.getElementById("habitInput").value = "";
      saveAndRender();
    });

    window.toggleHabit = (id) => {
      habits = habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
      saveAndRender();
    };

    window.deleteHabit = (id) => {
      habits = habits.filter(h => h.id !== id);
      saveAndRender();
    };

    window.setFilter = (cat) => {
      activeFilter = cat;
      renderCategoryOptions();
      renderHabits();
    };

    function saveAndRender() {
      localStorage.setItem("trackerHabits_v2", JSON.stringify(habits));
      const today = new Date().toISOString().split('T')[0];
      const total = habits.length;
      const done = habits.filter(h => h.completed).length;
      history[today] = total > 0 ? (done / total) : 0;
      localStorage.setItem("trackerHistory_v2", JSON.stringify(history));

      calculateStreak();
      renderHabits();
      renderCharts();
    }

    /* RENDER DE HÁBITOS CON CATEGORÍA ABAJO Y TARJETA VERDE AL COMPLETAR */
    function renderHabits() {
      const filtered = activeFilter === "Todos" ? habits : habits.filter(h => h.category === activeFilter);
      document.getElementById("habitList").innerHTML = filtered.map(h => `
        <li id="habit-${h.id}" class="habit-item ${h.completed ? 'completed' : ''}">
          <div class="habit-details">
            <span class="habit-title">${h.name}</span>
            <span class="habit-category-subtitle">${h.category}</span>
          </div>
          <div>
            <button class="btn-action ${h.completed ? 'check' : ''}" onclick="toggleHabit(${h.id})">${h.completed ? '✓' : '◯'}</button>
            <button class="btn-action delete" onclick="deleteHabit(${h.id})">✕</button>
          </div>
        </li>
      `).join('');
    }

    function renderCharts() {
      // 1. Tarta
      const total = habits.length;
      const done = habits.filter(h => h.completed).length;
      const percent = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById("pieSegment").setAttribute("stroke-dasharray", `${percent} 100`);
      document.getElementById("piePercent").textContent = `${percent}%`;

      // 2. Gráfica de Líneas Mensual (30 Días)
      const monthlySvg = document.getElementById("monthlyLineChart");
      monthlySvg.innerHTML = "";
      
      let points = [];
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const val = history[dateStr] || 0;
        
        const x = ((29 - i) / 29) * 280 + 10;
        const y = 90 - (val * 70);
        points.push(`${x},${y}`);

        // Puntos
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", x);
        circle.setAttribute("cy", y);
        circle.setAttribute("r", "3.5");
        circle.setAttribute("fill", "var(--accent-color)");
        monthlySvg.appendChild(circle);
      }

      const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      polyline.setAttribute("fill", "none");
      polyline.setAttribute("stroke", "var(--accent-color)");
      polyline.setAttribute("stroke-width", "2.5");
      polyline.setAttribute("points", points.join(" "));
      monthlySvg.prepend(polyline);

      // 3. Matriz Anual
      const yearGrid = document.getElementById("yearGrid");
      yearGrid.innerHTML = "";
      for (let i = 364; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const dayProgress = history[dateStr] || 0;

        const yDot = document.createElement("div");
        let lvl = "";
        if (dayProgress >= 1) lvl = "lvl-gold";
        else if (dayProgress > 0.6) lvl = "lvl-3";
        else if (dayProgress > 0.3) lvl = "lvl-2";
        else if (dayProgress > 0) lvl = "lvl-1";

        yDot.className = `year-dot ${lvl}`;
        yDot.title = `${dateStr}: ${Math.round(dayProgress * 100)}%`;
        yearGrid.appendChild(yDot);
      }
    }

    function calculateStreak() {
      const today = new Date().toISOString().split('T')[0];
      const todayProgress = history[today] || 0;
      const isTodayCompleted = todayProgress > 0;
      
      let streak = 0;
      let d = new Date();

      if (!isTodayCompleted) d.setDate(d.getDate() - 1);

      while (true) {
        const dateStr = d.toISOString().split('T')[0];
        if (history[dateStr] && history[dateStr] > 0) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else break;
      }

      currentStreak = streak;
      document.getElementById("streakCount").textContent = currentStreak;

      const container = document.getElementById("streakContainer");

      if (!isTodayCompleted && currentStreak === 0) {
        container.className = "streak-tag streak-grey";
      } else if (currentStreak >= 365) {
        container.className = "streak-tag streak-gold";
      } else if (currentStreak >= 100) {
        container.className = "streak-tag streak-purple-gold";
      } else if (currentStreak >= 50) {
        container.className = "streak-tag streak-green";
      } else if (currentStreak >= 30) {
        container.className = "streak-tag streak-blue";
      } else if (currentStreak >= 10) {
        container.className = "streak-tag streak-red";
      } else {
        container.className = "streak-tag streak-orange";
      }

      const goldDot = document.getElementById("goldThemeDot");
      if (currentStreak >= 365) {
        goldDot.classList.remove("locked");
        goldDot.textContent = "";
      } else {
        goldDot.classList.add("locked");
        goldDot.textContent = "🔒";
      }
    }

    /* IMPORTAR Y EXPORTAR JSON */
    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      const exportData = { habits, history, categories: customCategories, theme: localStorage.getItem("trackerTheme_v2") || "theme-naranja" };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ethos_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importJsonBtn").addEventListener("click", () => document.getElementById("importJsonInput").click());

    document.getElementById("importJsonInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.habits && imported.history) {
            habits = imported.habits;
            history = imported.history;
            if (imported.categories) customCategories = imported.categories;
            if (imported.theme) setTheme(imported.theme);

            localStorage.setItem("trackerCategories_v2", JSON.stringify(customCategories));
            saveAndRender();
            alert("¡Datos cargados correctamente!");
          }
        } catch (err) { alert("Error al procesar el archivo JSON."); }
      };
      reader.readAsText(file);
    });

    document.getElementById("openProfile").addEventListener("click", () => document.getElementById("profilePanel").classList.toggle("hidden"));
    document.getElementById("closeProfile").addEventListener("click", () => document.getElementById("profilePanel").classList.add("hidden"));
    document.getElementById("clearLocal").addEventListener("click", () => { localStorage.clear(); location.reload(); });
  </script>
</body>
</html>
